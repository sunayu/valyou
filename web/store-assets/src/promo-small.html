<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="kit.css" />
<style>
  .stage { width: 440px; height: 280px; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; }
  .mark { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .mark .shield { width: 72px; height: 72px; filter: drop-shadow(0 12px 26px rgba(79,124,255,0.4)); }
  .mark .wordmark { font-size: 46px; }
  .tag { font-family: var(--serif); font-size: 21px; line-height: 1.25; color: var(--ink); max-width: 20ch; }
  .tag .em { font-style: italic; color: transparent; background: var(--grad); -webkit-background-clip: text; background-clip: text; }
  .scan { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--grad); opacity: 0.9; }
  .glow { position: absolute; right: -40px; bottom: -60px; width: 220px; height: 220px; background: var(--grad); filter: blur(70px); opacity: 0.25; border-radius: 999px; }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="mark">
    <svg class="shield" viewBox="0 0 100 100"><defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#8b6cff"/></linearGradient></defs><path d="M18 24 Q18 14 28 14 H72 Q82 14 82 24 V50 Q82 75 50 90 Q18 75 18 50 Z" fill="url(#vg)"/><path d="M35 37 L50 61 L65 37" fill="none" stroke="#fff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="wordmark">valyou</span>
  </div>
  <div class="tag">Take the <span class="em">hate</span> out of your feed.</div>
  <div class="scan"></div>
</div>
</body>
</html>
