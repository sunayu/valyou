<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>valyou — promo (render harness)</title>
<style>
  html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="film.js"></script>
<script>
  (function () {
    var cv = document.getElementById("c");
    var ctx = cv.getContext("2d", { alpha: false });
    var FILM = window.VALYOU_FILM;

    // Deterministic single-frame render, used by the headless capturer.
    window.__frame = function (t) {
      ctx.save();
      ctx.clearRect(0, 0, FILM.W, FILM.H);
      FILM.frame(ctx, t);
      ctx.restore();
      return true;
    };

    // Query param ?t=NN renders one still (for quick visual checks).
    var q = new URLSearchParams(location.search);
    if (q.has("t")) { window.__frame(parseFloat(q.get("t"))); return; }
    if (q.has("capture")) { window.__frame(0); return; }

    // Otherwise: live preview loop (for eyeballing in a normal browser).
    var start = null;
    function loop(now) {
      if (start == null) start = now;
      var t = ((now - start) / 1000) % FILM.DUR;
      window.__frame(t);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
